<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>X Co Pilot</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --panel: #ffffff;
        --text: #111827;
        --muted: #64748b;
        --line: #dbe3ee;
        --soft: #f1f5f9;
        --primary: #0f172a;
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .panel {
        margin: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .title { font-size: 15px; font-weight: 800; }
      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }
      .row { margin: 10px 0; }
      label { display: flex; align-items: center; gap: 8px; color: #334155; }
      input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }
      .muted {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }
      button {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        padding: 9px 10px;
        margin-top: 8px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--soft); }
      #saveBtn { background: var(--primary); border-color: var(--primary); color: #fff; }
    </style>
  </head>
  <body>
    <div class="panel">
    <div class="head">
      <div class="title">X Co Pilot</div>
      <div class="badge">v1</div>
    </div>
    <div class="row">
      <label><input id="enabled" type="checkbox" /> enabled</label>
    </div>
    <div class="row">
      <label><input id="dryRun" type="checkbox" /> dry-run</label>
    </div>
    <div class="row muted" id="stats">loading...</div>
    <button id="saveBtn">Save quick toggle</button>
    <button id="openOptionsBtn">Open options</button>
    <button id="openLogsBtn">Open logs</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
