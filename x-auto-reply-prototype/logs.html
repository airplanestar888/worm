<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>X Co Pilot Logs</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --panel: #ffffff;
        --text: #111827;
        --muted: #64748b;
        --line: #dbe3ee;
        --soft: #f1f5f9;
        --primary: #0f172a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .page {
        width: min(1180px, calc(100vw - 32px));
        margin: 28px auto;
      }
      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
      .muted { color: var(--muted); font-size: 12px; line-height: 1.4; }
      .badge {
        display: inline-flex;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 999px;
        padding: 5px 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      button {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        padding: 8px 12px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--soft); }
      #refreshBtn { background: var(--primary); border-color: var(--primary); color: #fff; }
      #summary { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 880px; }
      th, td {
        border-bottom: 1px solid var(--line);
        padding: 10px;
        vertical-align: top;
        font-size: 13px;
      }
      th {
        background: var(--soft);
        color: #334155;
        text-align: left;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .03em;
      }
      td pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: inherit; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="header">
        <div>
          <h1>X Co Pilot Logs</h1>
          <div class="muted">Riwayat proses reply, skip, draft, dan error terbaru.</div>
        </div>
        <div class="badge">v1</div>
      </div>
      <section class="panel">
        <div class="toolbar">
          <button id="refreshBtn">Refresh</button>
          <button id="clearBtn">Clear logs</button>
          <button id="optionsBtn">Open options</button>
        </div>
        <div class="muted" id="summary">loading...</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 140px;">Time</th>
                <th style="width: 100px;">Status</th>
                <th style="width: 120px;">Author</th>
                <th>Tweet</th>
                <th>Reply</th>
                <th style="width: 140px;">Reason</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="logs.js"></script>
  </body>
</html>
